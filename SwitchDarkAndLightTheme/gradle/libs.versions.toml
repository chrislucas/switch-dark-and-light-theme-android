composeBom = "2026.11.01"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"

material = "1.14.0"
material3 = "1.5.0"
material3-adaptive = "1.3.0"
material3-adaptive-navigation-suite = "1.4.0"
